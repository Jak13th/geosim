# Sanctions, droits de douane spécifiques, réserves gelées et restrictions d'exportation au
# 25/09/2026 (SPEC §5.2, §8.6). Intensité par volet (0–1) : hypothèse GeoSim fondée sur l'étendue des
# mesures décrites par les sources ; `secondary` : sanctions secondaires contre les pays tiers.
# `bloc:<id>` désigne tous les membres d'un bloc (blocs.yaml).
version: 1
regimes:
  - id: west_rus
    name: Sanctions occidentales contre la Russie
    target: RUS
    senders: &id001 ['bloc:eu', USA, GBR, CAN, JPN, AUS, NZL, CHE, NOR, ISL, LIE]
    tracks: { trade: 0.6, finance: 0.9, technology: 0.9, energy: 0.7, elites: 0.9, transport: 0.7 }
