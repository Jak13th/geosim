    source: https://en.wikipedia.org/wiki/International_sanctions_during_the_Russo-Ukrainian_war
    date: '2026-09-25'
    confidence: medium
    note:
      '19 paquets européens et plus, plafond de prix du pétrole, sanctions américaines contre Rosneft
      et Lukoil (octobre 2025), sanctions secondaires ; intensités : hypothèse GeoSim.'
