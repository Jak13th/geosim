# Détroits et passages (SPEC §5.2, liste minimale). Phase 1a : géométrie seulement.
# Le trafic, le statut et les routes de contournement détaillées sont ajoutés en phase 1b ;
# les pays riverains sont calculés depuis la carte.
#
# Pour chaque passage :
#   gates   : une ou plusieurs lignes [lon, lat] qui coupent le passage de terre à terre ;
#             une route qui franchit une porte « traverse » le détroit, et fermer le détroit
#             bloque ses portes.
#   channel : chenal forcé navigable dans le graphe des routes maritimes (canaux, détroits
#             plus étroits qu'un pixel). La carte elle-même n'est pas modifiée.
#   test    : deux points en mer de part et d'autre ; le pipeline vérifie que la route la plus
#             courte entre eux franchit la porte, et qu'elle s'allonge (ou disparaît) quand la
#             porte est fermée.
# Coordonnées relevées pour GeoSim sur le trait de côte Natural Earth 10m et les articles
# cités ; la cohérence de chaque porte est vérifiée à chaque construction de la carte.
