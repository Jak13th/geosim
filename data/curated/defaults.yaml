# Hypothèses par défaut (confiance « assumption ») pour les paramètres sans source automatisée ni valeur
# curée (SPEC §5.3, niveau « standard »). Chaque règle porte une justification ; elle peut être modulée
# par groupe de revenu (by_income), type de régime (by_regime) ou nature d'entité (by_kind), dans cet
# ordre de priorité : by_kind, by_regime, by_income, value. Points de départ à calibrer.
version: 1
date: '2026-09-25'
source: Hypothèses GeoSim (voir chaque note)
