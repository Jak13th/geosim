      (https://en.wikipedia.org/wiki/List_of_coups_and_coup_attempts_by_country) pour l'Afghanistan,
      le Bangladesh, l'Argentine et la Bolivie ; pour le Pakistan (1958, 1969, 1977, 1999), la Birmanie
      (1962, 1988, 2021), le Honduras (1956, 1963, 2009), les Fidji (1987 ×2, 2000, 2006), le Venezuela
      (1992, 2002) et la Thaïlande (coups réussis depuis 1950), presse et synthèses généralistes citées
