  pol.military_loyalty:
    source:
      "V-Dem (dimension militaire, v2x_ex_military) n'a pas pu être consultée directement dans cette
      session (jeu de données volumineux, hors périmètre d'un accès web ponctuel) : à recaler quand
      l'accès sera possible. En attendant, quelques cas bien documentés où la cohésion ou la loyauté
      de l'armée envers le pouvoir en place est un fait notoire et sourcé individuellement (voir note
      par pays ci-dessous et SOURCES.md), plutôt qu'une dérivation mécanique du régime ou de
      l'historique des coups (qui biaiserait le risque de coup, déjà sensible à ces deux facteurs)."
    date: '2026-09-27'
    confidence: assumption
    note: "Couverture partielle et provisoire (9 pays), à valider et étendre avec V-Dem : Soudan
      (armée fracturée depuis la guerre civile SAF–RSF d'avril 2023, désertions documentées) ;
      Birmanie (Tatmadaw resté cohérent depuis le coup de 2021, malgré la guerre civile face à
      l'opposition) ; Égypte (institution dominante et unifiée depuis 2013, aucun coup depuis) ;
      Pakistan (institution dominante et cohérente, ingérence politique récurrente sans fracture
      interne) ; Mali, Burkina Faso, Niger (juntes consolidées depuis leurs coups respectifs de
      2020-2023, sans fracture interne rapportée à ce jour) ; Venezuela (armée restée loyale à
      Maduro malgré les crises de 2019 et suivantes, réseaux de corruption documentés) ; Inde
      (aucun coup ni tentative depuis 1947, tradition durable de subordination au pouvoir civil et
      de neutralité politique de l'armée, largement documentée en science politique — au-delà du
      défaut plat par régime, qui surestimait par ailleurs son risque de coup, D86)."
    values: { SDN: 25, MMR: 75, EGY: 80, PAK: 75, MLI: 65, BFA: 65, NER: 65, VEN: 70, IND: 95 }
