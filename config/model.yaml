    anchor_central_bank:
      value: 0.7
      range: [0, 1]
      unit: ''
      description: "Poids supplémentaire de la cible, multiplié par l'indépendance de la banque centrale (0–1)."
    adjustment_months:
      value: 12
      range: [1, 60]
      unit: 'mois'
      description: "Constante de temps de l'inflation de fond vers son ancrage."
    demand_pressure:
      value: 0.3
      range: [0, 2]
      unit: ''
      description: "Points d'inflation par point d'écart de production (surchauffe)."
    energy_passthrough:
      value: 1.0
      range: [0, 2]
      unit: ''
      description: 'Part du surcoût énergétique (en % du PIB) transmise au niveau des prix.'
    food_passthrough:
      value: 0.15
      range: [0, 1]
      unit: ''
      description: "Part de la variation du prix du blé transmise aux prix alimentaires (pondérée par la part de l'alimentation dans la consommation)."
    second_round:
      value: 0.3
      range: [0, 1]
      unit: ''
      description: "Part des chocs de prix importés qui passe dans l'inflation de fond (effets de second tour)."
    monetization:
      value: 3
      range: [0, 20]
