    debt_drag:
      value: 0.002
      range: [0, 0.02]
      unit: '%/an'
      description: 'Frein à la croissance par point de dette au-delà du seuil multiplié par la prime de risque (%), en écart à la situation initiale.'
    public_investment:
      value: 0.3
      range: [0, 2]
      unit: '%/an par point de PIB'
