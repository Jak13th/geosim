# Coefficients des modèles (SPEC §6.4, PARAMETRES.md §19).
# Rechargés à chaud (appliqués au tick suivant) et éditables dans l'onglet « Modèle ».
#
# Format de chaque coefficient :
#   nom:
#     value: 0.35
#     range: [0, 1]
#     unit: ""
#     description: "Explication en français."
#
# Les valeurs par défaut sont des points de départ à calibrer (docs/CALIBRATION.md), jamais des vérités.
# Les familles se remplissent au fil des phases, avec le système qui les utilise. Équations et hypothèses :
# docs/MODELES.md (§1 pour `geo`, §3 pour le moteur, §4 à §7 pour les systèmes de la phase 3).
version: 1
geo:
  # Seuils utilisés par le pipeline de la carte (npm run data). Modifier une valeur demande de
  # reconstruire la carte. Équations et sources : docs/MODELES.md §1.
  terrain:
    relief_radius_cells:
      value: 1
      range: [1, 3]
      unit: 'cellules WorldClim (5′)'
      description: "Rayon de la fenêtre où l'on mesure le relief local (altitude max − min). 1 = fenêtre 3×3, environ 28 km."
    hills_min_relief:
      value: 200
      range: [50, 800]
      unit: 'm'
      description: 'Relief local à partir duquel un pixel est classé en collines.'
    mountain_min_relief:
      value: 600
      range: [200, 2000]
      unit: 'm'
      description: 'Relief local à partir duquel un pixel est classé en montagne.'
    high_mountain_min_elevation:
      value: 3000
      range: [1500, 5000]
      unit: 'm'
      description: 'Altitude à partir de laquelle un pixel est classé en haute montagne, quel que soit son relief (hauts plateaux compris).'
  biome:
    tundra_max_warm_quarter_temp:
      value: 10
      range: [0, 15]
      unit: '°C'
      description: 'Température moyenne du trimestre le plus chaud (bio10) sous laquelle la forêt cède la place à la toundra (limite des arbres, climat E de Köppen).'
    arid_threshold_slope:
      value: 2
      range: [0, 5]
      unit: 'mm/°C'
      description: "Pente du seuil d'aridité de Köppen-Geiger : Pseuil = pente × Tannuelle + ordonnée (Kottek et al., 2006)."
    arid_threshold_intercept:
      value: 14
      range: [0, 50]
      unit: 'mm'
      description: "Ordonnée du seuil d'aridité de Köppen-Geiger (précipitations réparties sur l'année)."
    desert_factor:
      value: 5
      range: [1, 10]
      unit: ''
      description: 'Désert si Pannuelle < facteur × Pseuil (climat BW de Köppen).'
    steppe_factor:
      value: 10
      range: [5, 20]
      unit: ''
      description: 'Steppe si Pannuelle < facteur × Pseuil (climat BS de Köppen).'
    tropical_min_cold_quarter_temp:
      value: 18
      range: [10, 25]
      unit: '°C'
      description: 'Température moyenne du trimestre le plus froid (bio11) au-dessus de laquelle le climat est tropical (climat A de Köppen).'
    rainforest_min_driest_month:
      value: 60
      range: [0, 150]
      unit: 'mm'
      description: 'Précipitations du mois le plus sec (bio14) au-dessus desquelles un climat tropical porte une forêt (Af de Köppen).'
    monsoon_intercept:
      value: 100
      range: [0, 200]
      unit: 'mm'
      description: 'Forêt de mousson (Am) si le mois le plus sec reçoit au moins ordonnée − Pannuelle / diviseur ; sinon savane (Aw).'
    monsoon_divisor:
      value: 25
      range: [5, 100]
      unit: ''
      description: 'Diviseur de la règle de mousson de Köppen (voir monsoon_intercept).'
    temperate_steppe_max_index:
      value: 18
      range: [0, 40]
      unit: 'mm/°C'
      description: "Hypothèse à calibrer. En climat tempéré ou continental, steppe si Pannuelle / (T du trimestre le plus chaud + 10) est inférieur à ce seuil (indice d'aridité de De Martonne adapté à la saison de croissance). Rattrape les steppes que Köppen classe en climat humide (Kazakhstan, Ukraine du Sud, Grandes Plaines)."
    temperate_steppe_min_annual_temp:
      value: 0
      range: [-15, 15]
      unit: '°C'
      description: "Température annuelle en dessous de laquelle la règle de steppe tempérée ne s'applique pas : l'évaporation est trop faible, la taïga domine malgré des précipitations faibles (Iakoutie)."
  rivers:
    max_scalerank:
      value: 6
      range: [0, 12]
      unit: 'rang Natural Earth'
      description: "Rang maximal (0 = le plus important) d'un fleuve Natural Earth pour être marqué « fleuve majeur » (Dniepr : 4, Don : 6)."
  urban:
    supersampling:
      value: 4
      range: [1, 8]
      unit: 'sous-pixels par côté'
      description: 'Sur-échantillonnage utilisé pour estimer la part urbanisée de chaque pixel (0–255).'
  cities:
    major_min_population:
      value: 1000000
      range: [100000, 10000000]
      unit: 'habitants'
      description: 'Population (agglomération, Natural Earth POP_MAX) à partir de laquelle une ville est « majeure ».'
    list_min_population:
      value: 50000
      range: [0, 1000000]
      unit: 'habitants'
      description: "Population minimale d'une ville pour figurer dans la liste exportée (noyaux de population en phase 1b). Les capitales y figurent toujours."
  ports:
    snap_radius_km:
      value: 30
      range: [5, 100]
      unit: 'km'
      description: 'Distance maximale entre un port Natural Earth et le pixel côtier auquel on le rattache.'
  sea_zones:
    min_area_km2:
      value: 40000
      range: [0, 500000]
      unit: 'km²'
      description: "Surface minimale d'une mer, d'un golfe ou d'un détroit nommé pour former sa propre zone maritime ; les plus petits sont fondus dans la zone voisine."
    ocean_grid_deg:
      value: 30
      range: [10, 90]
      unit: '°'
      description: 'Pas de la grille (longitude et latitude) qui découpe les océans en zones maritimes.'
  maritime:
    boundary_km:
      value: 370.4
      range: [0, 1000]
      unit: 'km'
      description: "Portée de l'espace maritime d'un pays (200 milles marins, ZEE) pour le calcul des voisinages maritimes par équidistance."
  routing:
    cell_km:
      value: 60
      range: [20, 200]
      unit: 'km'
      description: 'Côté des cellules du graphe océanique grossier (routes maritimes). La connexité est préservée au pixel près.'
    polar_min_lat:
      value: 66.5
      range: [50, 90]
      unit: '°'
      description: 'Latitude (nord ou sud) au-delà de laquelle la navigation est pénalisée : glaces, navigation saisonnière (route du Nord, passage du Nord-Ouest).'
    polar_cost_factor:
      value: 4
      range: [1, 20]
      unit: ''
      description: 'Multiplicateur du coût des trajets au-delà de polar_min_lat pour le choix des routes. La longueur rapportée reste la distance réelle.'
  population:
    # Répartition de la population et de la valeur économique par pixel (phase 1b).
    # Hypothèses à calibrer ; équations : docs/MODELES.md §1.10.
    city_kernel_sigma_km:
      value: 8
      range: [2, 30]
      unit: 'km'
      description: "Écart-type du noyau gaussien d'une agglomération d'un million d'habitants ; il croît comme la racine de la population (Paris, 11 M : 27 km)."
    urban_area_density:
      value: 2000
      range: [200, 10000]
      unit: 'hab./km²'
      description: 'Densité attribuée aux zones urbaines Natural Earth (villes absentes de la liste des villes), en poids relatif avant normalisation.'
    habitability_temperate_forest:
      value: 1
      range: [0, 2]
      unit: ''
      description: 'Habitabilité rurale relative du biome forêt tempérée ou boréale (référence 1 ; inclut les terres agricoles tempérées).'
    habitability_tropical_forest:
      value: 0.5
      range: [0, 2]
      unit: ''
      description: 'Habitabilité rurale relative du biome forêt tropicale.'
    habitability_steppe_savanna:
      value: 0.6
      range: [0, 2]
      unit: ''
      description: 'Habitabilité rurale relative du biome steppe ou savane.'
    habitability_desert:
      value: 0.005
      range: [0, 0.5]
      unit: ''
      description: 'Habitabilité rurale relative du désert, hors fleuves (oasis et vallées sont portées par le bonus fleuve et par les villes).'
    habitability_tundra:
      value: 0.01
      range: [0, 0.5]
      unit: ''
      description: 'Habitabilité rurale relative de la toundra.'
    habitability_wetland:
      value: 0.5
      range: [0, 2]
      unit: ''
      description: 'Habitabilité rurale relative des zones humides et deltas (deltas du Nil, du Gange, du Mékong…).'
    terrain_factor_hills:
      value: 0.6
      range: [0, 1]
      unit: ''
      description: "Multiplicateur d'habitabilité des collines (plaine = 1)."
    terrain_factor_mountain:
      value: 0.25
      range: [0, 1]
      unit: ''
      description: "Multiplicateur d'habitabilité de la montagne."
    terrain_factor_high_mountain:
      value: 0.05
      range: [0, 1]
      unit: ''
      description: "Multiplicateur d'habitabilité de la haute montagne (plateau tibétain, Altiplano hors villes)."
    river_bonus:
      value: 1
      range: [0, 5]
      unit: ''
      description: 'Habitabilité ajoutée aux pixels de fleuve majeur (vallées irriguées : Nil, Indus, Tigre et Euphrate).'
    coast_factor:
      value: 1.3
      range: [0.5, 3]
      unit: ''
      description: "Multiplicateur d'habitabilité des pixels côtiers."
    urban_productivity_premium:
      value: 1
      range: [0, 5]
      unit: ''
      description: "Prime de productivité de la population urbaine : la valeur économique d'un pixel est proportionnelle à population × (1 + prime × part urbaine)."
demography:
  mortality:
    age_0_14:
      value: 2
      range: [0.1, 20]
      unit: '‰/an'
      description: 'Mortalité de référence des 0–14 ans. Les trois taux de référence donnent la forme de la mortalité par âge ; un facteur propre à chaque pays, calé au départ, reproduit sa mortalité observée (MODELES §4).'
    age_15_64:
      value: 3.5
      range: [0.5, 20]
      unit: '‰/an'
      description: 'Mortalité de référence des 15–64 ans (voir age_0_14).'
    age_65plus:
      value: 50
      range: [10, 150]
      unit: '‰/an'
      description: 'Mortalité de référence des 65 ans et plus (voir age_0_14) : le vieillissement fait monter la mortalité brute.'
    annual_decline:
      value: 1
      range: [0, 3]
      unit: '%/an'
      description: 'Baisse annuelle des taux de mortalité par âge (progrès sanitaire), hors guerres, famines et épidémies.'
  fertility:
    long_run:
      value: 1.8
      range: [1, 3]
      unit: 'enfants/femme'
      description: 'Fécondité de long terme vers laquelle converge chaque pays (hypothèse proche de celle des Nations unies, World Population Prospects).'
    convergence_years:
      value: 50
      range: [10, 200]
      unit: 'ans'
      description: "Constante de temps de la convergence de la fécondité : en 20 ans, un tiers de l'écart au long terme se referme (Niger : 6,1 → 4,7 ; Corée : 0,72 → 1,08)."
  life_expectancy:
    max:
      value: 100
      range: [85, 120]
      unit: 'ans'
      description: "Plafond de l'espérance de vie : le gain annuel diminue linéairement jusqu'à ce plafond."
    annual_gain:
      value: 0.25
      range: [0, 1]
      unit: 'an/an'
      description: "Gain annuel d'espérance de vie d'un pays dont l'espérance de vie est de 60 ans (Nations unies : environ 0,2 à 0,3 an par an)."
  urbanization:
    max:
      value: 95
      range: [80, 100]
      unit: '%'
      description: "Taux d'urbanisation maximal (croissance logistique)."
    speed:
      value: 0.02
      range: [0, 0.1]
      unit: '/an'
      description: "Vitesse de la croissance logistique de l'urbanisation (≈ 0,5 point par an à 50 %)."
  manpower:
    fitness_rate:
      value: 0.75
      range: [0.3, 1]
      unit: ''
      description: 'Part des 18–49 ans aptes au service (hommes et femmes), pour le réservoir mobilisable.'
  famine:
    stress_threshold:
      value: 15
      range: [0, 100]
      unit: 'points'
      description: 'Tension alimentaire au-delà de laquelle la famine augmente la mortalité (pays pauvres).'
    income_threshold:
      value: 4000
      range: [100, 50000]
      unit: '$'
      description: 'PIB par habitant (dollars du départ) au-delà duquel la famine ne tue plus : surmortalité × (1 − PIB par habitant / seuil).'
    mortality:
      value: 0.05
      range: [0, 2]
      unit: '‰/an par point'
      description: 'Surmortalité par point de tension alimentaire au-delà du seuil (pays les plus pauvres).'
    event_threshold:
      value: 0.5
      range: [0.01, 20]
      unit: '‰/an'
      description: 'Surmortalité à partir de laquelle une famine est consignée au journal.'
  refugees:
    insurgency_weight:
      value: 1
      range: [0, 5]
      unit: ''
      description: "Poids de l'insurrection (0-1) dans la pression de départ."
    war_weight:
      value: 1
      range: [0, 5]
      unit: ''
      description: "Poids de l'exposition à une guerre terrestre (0-1) dans la pression de départ."
    famine_weight:
      value: 0.1
      range: [0, 5]
      unit: 'par ‰/an'
      description: 'Poids de la surmortalité de famine dans la pression de départ.'
    collapse_weight:
      value: 0.1
      range: [0, 5]
      unit: ''
      description: "Poids de l'effondrement de l'État (stabilité sous le seuil) dans la pression de départ."
    collapse_threshold:
      value: 10
      range: [1, 100]
      unit: 'indice'
      description: "Stabilité sous laquelle l'effondrement de l'État pousse au départ."
    displacement:
      value: 0.15
      range: [0, 1]
      unit: ''
      description: 'Nouveaux réfugiés visés par unité de pression de départ au-delà du départ, en part de la population.'
    pressure_threshold:
      value: 0.1
      range: [0, 1]
      unit: ''
      description: "Hausse de la pression de départ en deçà de laquelle les déplacements restent internes (pas de réfugiés à l'étranger) ; seuls les départs au-delà franchissent les frontières."
    outflow_months:
      value: 4
      range: [1, 60]
      unit: 'mois'
      description: 'Délai des départs vers le stock visé.'
    return_months:
      value: 24
      range: [1, 240]
      unit: 'mois'
      description: 'Délai des retours quand la pression retombe.'
    distance_km:
      value: 1000
      range: [100, 20000]
      unit: 'km'
      description: 'Distance sur laquelle l’attrait d’une destination non voisine est divisé par e.'
    income_elasticity:
      value: 0.25
      range: [0, 3]
      unit: ''
      description: "Élasticité de l'attrait d'une destination au rapport des PIB par habitant (destination / origine)."
    income_max_ratio:
      value: 3
      range: [1, 100]
      unit: ''
      description: "Borne de l'effet du revenu sur l'attrait d'une destination (entre 1/borne et borne)."
    size_elasticity:
      value: 1
      range: [0.5, 2]
      unit: ''
      description: "Élasticité de l'attrait d'une destination à sa population (effet de masse des modèles de gravité). À 1, les réfugiés se répartissent au prorata de la population des pays d'accueil à attrait égal (charge par habitant neutre) ; en dessous, les petits pays reçoivent davantage par habitant."
    max_monthly_outflow:
      value: 0.2
      range: [0.001, 1]
      unit: '/mois'
      description: 'Part maximale de la population qui peut partir en un mois (borne de sécurité).'
    cost_share:
      value: 0.3
      range: [0, 3]
      unit: 'PIB par habitant'
      description: "Coût annuel d'accueil d'un réfugié supplémentaire, en PIB par habitant du pays d'accueil."
    aid_share:
      value: 0.3
      range: [0, 1]
      unit: ''
      description: "Part du coût d'accueil couverte par l'aide internationale."
    crisis_threshold:
      value: 0.1
      range: [0.001, 10]
      unit: '% de la population'
      description: 'Départs mensuels au-delà desquels une crise des réfugiés est consignée au journal.'
economy:
  potential:
    frontier_growth:
      value: 1.3
      range: [0, 3]
      unit: '%/an'
      description: 'Progrès de la productivité à la frontière technologique (économies les plus avancées).'
    frontier_income:
      value: 85000
      range: [40000, 150000]
      unit: '$ PPA/hab.'
      description: 'Revenu par habitant (PPA, dollars du départ) de la frontière ; les États-Unis sont à ≈ 89 000 $ en 2025 (FMI). Il croît au rythme frontier_growth.'
    convergence_rate:
      value: 2.5
      range: [0, 5]
      unit: '%/an'
      description: "Rattrapage : croissance supplémentaire par point d'écart logarithmique de revenu à la frontière (au-delà du seuil de convergence), multipliée par la qualité des institutions (efficacité gouvernementale et état de droit, 0–1). Convergence conditionnelle (Barro)."
    convergence_threshold:
      value: 0.3
      range: [0, 1.5]
      unit: 'point log'
      description: 'Écart logarithmique de revenu à la frontière en deçà duquel le rattrapage cesse : les économies à moins de 35 % de la frontière (Japon, Allemagne, Italie) ne convergent plus.'
    labor_elasticity:
      value: 0.7
      range: [0, 1.2]
      unit: ''
      description: 'Part de la croissance de la population en âge de travailler qui se retrouve dans la croissance du PIB (part du travail).'
    adjustment_years:
      value: 8
      range: [1, 50]
      unit: 'ans'
      description: 'Constante de temps de la convergence de la croissance potentielle (projections du FMI au départ) vers la croissance de long terme.'
    long_run_min:
      value: -1
      range: [-5, 2]
      unit: '%/an'
      description: 'Plancher de la croissance de long terme.'
    long_run_max:
      value: 7
      range: [3, 12]
      unit: '%/an'
      description: 'Plafond de la croissance de long terme.'
  growth:
    trade_spillover:
      value: 1.0
      range: [0, 3]
      unit: ''
      description: "Contagion commerciale : l'écart de production d'un pays tend vers cette part de la moyenne des écarts de ses partenaires, pondérés par ses exportations vers eux rapportées à son PIB."
    energy_importer:
      value: 0.6
      range: [0, 3]
      unit: ''
      description: "Perte d'activité (points de PIB) par point de PIB de hausse de la facture énergétique nette d'un importateur ; l'effet se résorbe avec le cycle."
    energy_exporter:
      value: 0.15
      range: [0, 1]
      unit: ''
      description: "Gain d'activité (points de PIB) par point de PIB de hausse des recettes énergétiques nettes d'un exportateur (surtout épargnées)."
    hydrocarbon_volume:
      value: 1.0
      range: [0, 3]
      unit: ''
      description: "Effet sur le niveau du PIB d'une variation des volumes d'hydrocarbures produits, en proportion des rentes (% du PIB) : la production est de la valeur ajoutée ; l'effet dure autant que la variation (fermeture d'un détroit, quotas)."
    stability_threshold:
      value: 50
      range: [0, 100]
      unit: 'indice'
      description: "Stabilité politique en dessous de laquelle l'instabilité freine la croissance."
    stability_drag:
      value: 0.002
      range: [0, 0.02]
      unit: '%/an par point²'
      description: 'Frein à la croissance par point de stabilité sous le seuil, au carré, en écart à la situation initiale (déjà comprise dans les projections du FMI).'
    debt_threshold:
      value: 90
      range: [30, 200]
      unit: '% PIB'
      description: 'Seuil de dette au-delà duquel la dette freine la croissance (en proportion de la prime de risque).'
    debt_threshold_reserve_bonus:
      value: 150
      range: [0, 400]
      unit: 'points de PIB'
      description: 'Relèvement du seuil de dette par unité de part de la monnaie dans les réserves mondiales (dollar : ≈ + 85 points).'
    debt_drag:
      value: 0.002
      range: [0, 0.02]
      unit: '%/an'
      description: 'Frein à la croissance par point de dette au-delà du seuil multiplié par la prime de risque (%), en écart à la situation initiale.'
    public_investment:
      value: 0.3
      range: [0, 2]
      unit: '%/an par point de PIB'
      description: "Croissance supplémentaire par point de PIB d'investissement public en infrastructures au-delà du niveau initial."
    insurgency_drag:
      value: 4
      range: [0, 20]
      unit: '%/an par 100 points'
      description: "Perte de croissance structurelle due à l'insurrection et à la guerre civile au-delà du départ."
    food_importer:
      value: 0.6
      range: [0, 3]
      unit: ''
      description: "Effet sur l'écart de production (points) d'une hausse de 1 point de PIB de la facture céréalière d'un importateur net."
    food_exporter:
      value: 0.15
      range: [0, 3]
      unit: ''
      description: "Effet sur l'écart de production d'un gain de 1 point de PIB des exportations céréalières nettes."
  cycle:
    persistence:
      value: 0.95
      range: [0, 0.99]
      unit: '/mois'
      description: "Persistance mensuelle de l'écart de production (demi-vie d'environ un an)."
    noise:
      value: 0.3
      range: [0, 2]
      unit: '% du PIB'
      description: "Écart-type des chocs mensuels sur l'écart de production d'un pays parfaitement stable (écart-type de la croissance annuelle ≈ 3 fois cette valeur) ; il croît avec l'instabilité."
